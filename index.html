<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BP Motor Panel</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";
        const firebaseConfig = {
            apiKey: "AIzaSyAdU0803CwzkKBIC9VTFBT6X29xhOeUi3g",
            authDomain: "bp-motor-panel.firebaseapp.com",
            databaseURL: "https://bp-motor-panel-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bp-motor-panel",
            storageBucket: "bp-motor-panel.firebasestorage.app",
            messagingSenderId: "186220670912",
            appId: "1:186220670912:web:212992e82056da7a31e225"
        };
        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app); window.db = getDatabase(app);
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.onAuthStateChanged = onAuthStateChanged; window.signOut = signOut;
        window.ref = ref; window.set = set; window.onValue = onValue;
        window.query = query; window.limitToLast = limitToLast;
        window.dispatchEvent(new Event('firebase-ready'));
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #0a0a1a; color: #fff; padding: 5px; min-height: 100dvh; }
        .page { display: none; max-width: 400px; margin: 0 auto; }
        .page.active { display: block; }
        .card { background: #16213e; padding: 10px; border-radius: 10px; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; margin: 3px 0; background: #1a1a2e; border: 1px solid #333; border-radius: 5px; color: #fff; font-size: 13px; }
        button { padding: 10px 14px; border: none; border-radius: 5px; color: #fff; font-weight: bold; cursor: pointer; font-size: 10px; }
        .btn-start { background: #4CAF50; }
        .btn-stop { background: #f44336; }
        .btn-sm { padding: 6px 8px; font-size: 9px; margin-left: 2px; }
        .btn-logs { background: #9C27B0; }
        .btn-ping { background: #FF9800; }
        .btn-restart { background: #f44336; }
        .btn-logout { background: #333; border: 1px solid #f44336; color: #f44336; }
        .motor-box { background: #0f3460; border-radius: 8px; padding: 12px; text-align: center; border: 2px solid #f44336; margin: 5px 0; }
        .motor-box.running { border-color: #4CAF50; }
        .motor-state { font-size: 18px; font-weight: 900; }
        .motor-box.running .motor-state { color: #4CAF50; }
        .motor-box:not(.running) .motor-state { color: #f44336; }
        .motor-info { font-size: 8px; color: #aaa; }
        .motor-relay { font-size: 8px; margin-top: 2px; padding: 2px 8px; border-radius: 8px; display: inline-block; }
        .motor-box.running .motor-relay { background: rgba(76,175,80,0.2); color: #81C784; }
        .motor-box:not(.running) .motor-relay { background: rgba(244,67,54,0.2); color: #EF9A9A; }
        .btn-row { display: flex; gap: 8px; justify-content: center; margin: 5px 0; }
        .btn { padding: 12px 20px; font-size: 13px; min-width: 80px; }
        .status-row { display: flex; gap: 4px; margin: 4px 0; }
        .status-card { flex: 1; background: #0f3460; padding: 6px; border-radius: 5px; text-align: center; }
        .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 2px; }
        .dot.green { background: #4CAF50; }
        .dot.red { background: #f44336; }
        .dot.gray { background: #666; }
        .status-card .label { font-size: 7px; color: #aaa; display: block; }
        .status-card .value { font-size: 9px; font-weight: bold; }
        .timer-section { background: #0f3460; border-radius: 8px; padding: 8px; margin: 4px 0; text-align: center; }
        .timer-inputs { display: flex; gap: 5px; margin-bottom: 4px; }
        .timer-group { flex: 1; }
        .timer-group input { font-size: 14px; text-align: center; }
        .btn-timer { width: 100%; padding: 7px; background: #667eea; font-size: 10px; }
        .stats-row { display: flex; gap: 4px; margin: 4px 0; }
        .stat-card { flex: 1; background: #0f3460; padding: 6px; border-radius: 5px; text-align: center; }
        .stat-value { font-size: 13px; font-weight: bold; color: #64B5F6; }
        .stat-label { font-size: 6px; color: #aaa; }
        .history-section { background: #0f3460; border-radius: 8px; padding: 6px; margin: 4px 0; }
        .history-title { font-size: 8px; color: #aaa; text-align: center; }
        .history-item { display: flex; padding: 4px 5px; margin: 1px 0; background: rgba(0,0,0,0.3); border-radius: 4px; font-size: 8px; border-left: 2px solid #555; }
        .history-action.on { color: #4CAF50; font-weight: bold; }
        .history-action.off { color: #f44336; font-weight: bold; }
        .history-time { font-size: 7px; color: #aaa; margin-left: auto; }
        .shell-box { background: #0a0a0a; border-radius: 6px; border: 1px solid #333; margin-bottom: 5px; }
        .shell-header { padding: 5px 8px; background: #1a1a1a; font-size: 9px; color: #ccc; display: flex; justify-content: space-between; }
        .shell-content { padding: 5px; max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 8px; color: #e0e0e0; }
        .log-time { color: #4FC3F7; margin-right: 5px; }
        .ping-result { font-size: 9px; text-align: center; display: none; }
        .ping-result.success { color: #4CAF50; display: block; }
        .ping-result.fail { color: #f44336; display: block; }
        .error-msg { color: #f44336; font-size: 11px; display: none; }
        .error-msg.show { display: block; }
        .toast { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); background: #333; padding: 6px 14px; border-radius: 5px; font-size: 10px; display: none; }
        .toast.show { display: block; }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>

    <div class="page active" id="loginPage">
        <div class="card" style="text-align:center;margin-top:30px;">
            <h2 style="margin-bottom:10px;">BP Motor Panel</h2>
            <input type="email" id="emailInput" placeholder="Email">
            <input type="password" id="passwordInput" placeholder="Password">
            <button style="width:100%;background:#667eea;padding:12px;" onclick="doLogin()">Sign In</button>
            <div class="error-msg" id="loginError"></div>
        </div>
    </div>

    <div class="page" id="dashboardPage">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">
            <h2 style="font-size:15px;">BP Motor Panel</h2>
            <div>
                <button class="btn-sm btn-ping" onclick="checkConnection()">Check</button>
                <button class="btn-sm btn-restart" onclick="restartMaster()">Restart</button>
                <button class="btn-sm btn-logs" onclick="showPage('logsPage')">Logs</button>
                <button class="btn-sm btn-logout" onclick="doLogout()">Exit</button>
            </div>
        </div>
        <div class="card">
            <div class="motor-box" id="motorBox">
                <div class="motor-state" id="motorState">STOPPED</div>
                <div class="motor-info" id="motorSource"></div>
                <div class="motor-relay" id="motorRelay">Relay 2 (NC)</div>
                <div class="timer-preview" id="timerPreview" style="display:none;"></div>
                <div class="timer-countdown" id="timerCountdown" style="display:none;"></div>
            </div>
            <div class="btn-row">
                <button class="btn btn-start" id="startBtn" onclick="startMotor()">START</button>
                <button class="btn btn-stop" onclick="stopMotor()">STOP</button>
            </div>
            <div class="ping-result" id="pingResult"></div>
            <div class="status-row">
                <div class="status-card"><span class="dot gray" id="masterDot"></span><span class="label">Master</span><span class="value" id="masterStatus">--</span></div>
                <div class="status-card"><span class="dot gray" id="loraDot"></span><span class="label">LoRa</span><span class="value" id="loraStatus">--</span></div>
                <div class="status-card"><span class="dot gray" id="slaveDot"></span><span class="label">Slave</span><span class="value" id="slaveStatus">--</span></div>
            </div>
            <div class="timer-section">
                <div style="font-size:8px;color:#aaa;margin-bottom:3px;">TIMER</div>
                <div class="timer-inputs">
                    <div class="timer-group"><input type="number" id="hrs" placeholder="Hours" min="0" max="23" value="0"></div>
                    <div class="timer-group"><input type="number" id="mins" placeholder="Mins" min="0" max="59" value="0"></div>
                </div>
                <button class="btn-timer" onclick="setTimerValue()">Set Timer</button>
            </div>
            <div class="stats-row">
                <div class="stat-card"><div class="stat-value" id="statPings">0</div><div class="stat-label">Pings</div></div>
                <div class="stat-card"><div class="stat-value" id="statMissed">0</div><div class="stat-label">Missed</div></div>
                <div class="stat-card"><div class="stat-value" id="statRestarts">0</div><div class="stat-label">Restart</div></div>
            </div>
            <div class="history-section">
                <div class="history-title">HISTORY</div>
                <div id="historyList"><div style="color:#aaa;font-size:8px;">Waiting...</div></div>
            </div>
        </div>
    </div>

    <div class="page" id="logsPage">
        <div style="display:flex;justify-content:space-between;margin-bottom:5px;">
            <h2 style="font-size:15px;">Shell Logs</h2>
            <button class="btn-sm btn-logs" onclick="showPage('dashboardPage')">Home</button>
        </div>
        <div class="card">
            <div class="shell-box">
                <div class="shell-header"><span>Master</span><button class="btn-sm" onclick="clearLogs('master_logs')">Clear</button></div>
                <div class="shell-content" id="masterContent"><div style="color:#555;">Waiting...</div></div>
            </div>
            <div class="shell-box">
                <div class="shell-header"><span>Slave</span><button class="btn-sm" onclick="clearLogs('slave_logs')">Clear</button></div>
                <div class="shell-content" id="slaveContent"><div style="color:#555;">Waiting...</div></div>
            </div>
        </div>
    </div>

    <script>
        let motorRunning = false, motorHistory = [], timerInterval = null;
        let pendingTimerMinutes = 0, cmdId = 0;

        function showPage(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        function clearLogs(path) { window.set(window.ref(window.db, path), null); }
        function showToast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
        
        window.addEventListener('firebase-ready', function() {
            const auth = window.auth, db = window.db;
            
            window.onAuthStateChanged(auth, function(user) {
                if (user) { showPage('dashboardPage'); setupListeners(); loadHistory(); loadLogs(); }
                else { showPage('loginPage'); }
            });
            
            window.doLogin = function() {
                const email = document.getElementById('emailInput').value.trim();
                const password = document.getElementById('passwordInput').value;
                const err = document.getElementById('loginError');
                err.classList.remove('show');
                if (!email || !password) { err.textContent = 'Enter credentials'; err.classList.add('show'); return; }
                const btn = document.getElementById('loginBtn');
                btn.disabled = true;
                window.signInWithEmailAndPassword(auth, email, password)
                    .catch(error => { err.textContent = error.message; err.classList.add('show'); btn.disabled = false; });
            };
            
            window.doLogout = function() { window.signOut(auth); showPage('loginPage'); };
            
            window.restartMaster = function() {
                if (confirm('Restart master?')) {
                    cmdId++;
                    window.set(window.ref(db, 'motor_control'), {command: 'restart', command_id: cmdId, timestamp: Date.now(), source: 'web'});
                    showToast('Restart sent');
                }
            };
            
            window.checkConnection = function() {
                cmdId++;
                window.set(window.ref(db, 'motor_control'), {command: 'ping', command_id: cmdId, timestamp: Date.now(), source: 'web'});
                showToast('Checking...');
                window.onValue(window.ref(db, 'ping_response'), function(snap) {
                    const d = snap.val();
                    if (d) {
                        document.getElementById('pingResult').textContent = 'Master: ' + (d.master_online ? 'Online' : 'Offline') + ' | Slave: ' + (d.slave_online ? 'Online' : 'Offline');
                        document.getElementById('pingResult').className = 'ping-result ' + (d.master_online ? 'success' : 'fail');
                    }
                }, { onlyOnce: true });
            };
            
            window.startMotor = function() {
                cmdId++;
                if (pendingTimerMinutes > 0) {
                    window.set(window.ref(db, 'motor_control'), {command: 'timer', command_id: cmdId, timestamp: Date.now(), source: 'web', minutes: pendingTimerMinutes});
                } else {
                    window.set(window.ref(db, 'motor_control'), {command: 'on', command_id: cmdId, timestamp: Date.now(), source: 'web'});
                }
                showToast('Starting...');
            };
            
            window.stopMotor = function() {
                cmdId++;
                window.set(window.ref(db, 'motor_control'), {command: 'off', command_id: cmdId, timestamp: Date.now(), source: 'web'});
                showToast('Stopping...');
            };
            
            window.setTimerValue = function() {
                const h = parseInt(document.getElementById('hrs').value) || 0;
                const m = parseInt(document.getElementById('mins').value) || 0;
                const total = h * 60 + m;
                if (total <= 0) { showToast('Set time'); return; }
                pendingTimerMinutes = total;
                document.getElementById('timerPreview').textContent = 'Timer: ' + h + 'h ' + m + 'm';
                document.getElementById('timerPreview').style.display = 'block';
                showToast('Timer set - press START');
            };
            
            function setupListeners() {
                window.onValue(window.ref(db, 'motor_status'), function(snap) {
                    const d = snap.val();
                    if (d) updateMotorBox(d.running, d.source);
                });
                window.onValue(window.ref(db, 'system_status'), function(snap) {
                    const d = snap.val();
                    if (d) {
                        document.getElementById('masterDot').className = 'dot ' + (d.wifi_connected ? 'green' : 'red');
                        document.getElementById('masterStatus').textContent = d.wifi_connected ? 'Online' : 'Offline';
                        document.getElementById('loraDot').className = 'dot ' + (d.slave_online ? 'green' : 'red');
                        document.getElementById('loraStatus').textContent = d.slave_online ? 'Connected' : 'Off';
                        document.getElementById('slaveDot').className = 'dot ' + (d.slave_online && d.wifi_connected ? 'green' : 'red');
                        document.getElementById('slaveStatus').textContent = (d.slave_online && d.wifi_connected) ? 'Online' : 'Offline';
                        document.getElementById('statPings').textContent = d.lora_ping_count || 0;
                        document.getElementById('statMissed').textContent = d.lora_missed || 0;
                    }
                });
                window.onValue(window.ref(db, 'slave_details'), function(snap) {
                    const d = snap.val();
                    if (d) document.getElementById('statRestarts').textContent = d.restart_count || 0;
                });
            }
            
            function updateMotorBox(running, source) {
                motorRunning = running;
                const box = document.getElementById('motorBox');
                const btn = document.getElementById('startBtn');
                if (running) {
                    box.className = 'motor-box running';
                    document.getElementById('motorState').textContent = 'ON';
                    document.getElementById('motorSource').textContent = 'By: ' + getSrc(source);
                    document.getElementById('motorRelay').textContent = 'Relay 1 (NO)';
                    if (btn) btn.disabled = true;
                } else {
                    box.className = 'motor-box';
                    document.getElementById('motorState').textContent = 'STOPPED';
                    document.getElementById('motorSource').textContent = source ? 'By: ' + getSrc(source) : '';
                    document.getElementById('motorRelay').textContent = 'Relay 2 (NC)';
                    if (btn) btn.disabled = false;
                }
            }
            
            function loadHistory() {
                window.onValue(window.query(window.ref(db, 'motor_history'), window.limitToLast(6)), function(snap) {
                    const d = snap.val();
                    if (d) {
                        motorHistory = Object.values(d).sort((a,b) => b.timestamp - a.timestamp).slice(0, 6);
                        renderHistory();
                    }
                });
            }
            
            function renderHistory() {
                const list = document.getElementById('historyList');
                if (!motorHistory.length) { list.innerHTML = '<div style="color:#aaa;font-size:8px;">No events</div>'; return; }
                let h = '';
                motorHistory.forEach(e => {
                    const isOn = e.action === 'on';
                    h += '<div class="history-item">' +
                        '<span class="history-action ' + (isOn ? 'on' : 'off') + '">' + (isOn ? 'ON' : 'OFF') + '</span>' +
                        '<span style="margin-left:5px;font-size:7px;color:#aaa;">' + getSrc(e.source) + '</span>' +
                        '<span class="history-time">' + formatTime(e.timestamp) + '</span>' +
                        '</div>';
                });
                list.innerHTML = h;
            }
            
            function loadLogs() {
                window.onValue(window.query(window.ref(db, 'master_logs'), window.limitToLast(20)), function(snap) {
                    const d = snap.val();
                    document.getElementById('masterContent').innerHTML = d ? renderLogs(Object.values(d).sort((a,b) => b.time - a.time)) : '<div>No logs</div>';
                });
                window.onValue(window.query(window.ref(db, 'slave_logs'), window.limitToLast(20)), function(snap) {
                    const d = snap.val();
                    document.getElementById('slaveContent').innerHTML = d ? renderLogs(Object.values(d).sort((a,b) => b.time - a.time)) : '<div>No logs</div>';
                });
            }
            
            function renderLogs(logs) {
                let h = '';
                logs.forEach(l => {
                    h += '<div><span class="log-time">' + formatLogTime(l.time) + '</span>' + (l.msg || '') + '</div>';
                });
                return h || '<div>No logs</div>';
            }
            
            function formatLogTime(ts) {
                if (!ts) return '--:--:--';
                if (ts < 1e12) ts *= 1000;
                const d = new Date(ts);
                if (isNaN(d.getTime())) return '--:--:--';
                return d.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true, timeZone:'Asia/Kolkata'});
            }
            
            function getSrc(s) { const m = {push_button:'Button', web_dashboard:'Web', timer:'Timer'}; return m[s] || s || 'System'; }
            
            function formatTime(ts) {
                if (!ts) return '--';
                if (ts < 1e12) ts *= 1000;
                const d = new Date(ts);
                if (isNaN(d.getTime())) return '--';
                const n = new Date(), df = n - d;
                if (df < 60000) return 'Now';
                if (df < 3600000) return Math.floor(df/60000) + 'm';
                if (df < 86400000) return d.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit', hour12:true, timeZone:'Asia/Kolkata'});
                return d.toLocaleDateString('en-IN', {day:'2-digit', month:'short', timeZone:'Asia/Kolkata'}) + ' ' + d.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit', hour12:true, timeZone:'Asia/Kolkata'});
            }
        });
    </script>
</body>
</html>
