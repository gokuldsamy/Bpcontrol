<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a1a">
    <title>BP Motor Panel</title>

    <!-- Firebase Compat SDKs (easier for auth & database) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-dark: #0a0a1a;
            --bg-card: #16213e;
            --bg-panel: #0f3460;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --on-color: #4CAF50;
            --off-color: #f44336;
            --push-color: #FF9800;
            --web-color: #2196F3;
            --timer-color: #CE93D8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            gap: 8px;
            min-height: 100dvh;
        }
        .page {
            display: none;
            width: 100%;
            max-width: 500px;
            flex: 1;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
        }
        .page.active { display: flex; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .top-bar h2 {
            font-size: 18px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-sm {
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            color: #fff;
            background: #333;
        }
        .btn-logs { background: #9C27B0; }
        .btn-ping { background: #FF9800; }
        .btn-restart { background: #f44336; }
        .btn-logout { background: transparent; border: 1px solid #f44336; color: #f44336; }
        .btn-back { background: #333; }

        .card {
            background: var(--bg-card);
            padding: 12px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .motor-box {
            background: var(--bg-panel);
            border-radius: 12px;
            padding: 18px 12px;
            text-align: center;
            border: 2px solid var(--off-color);
            transition: all 0.3s;
        }
        .motor-box.running { border-color: var(--on-color); box-shadow: 0 0 25px rgba(76,175,80,0.3); }
        .motor-state { font-size: 24px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        .motor-box.running .motor-state { color: var(--on-color); }
        .motor-box:not(.running) .motor-state { color: var(--off-color); }
        .motor-info { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }
        .motor-relay {
            display: inline-block;
            font-size: 9px;
            margin-top: 4px;
            padding: 3px 10px;
            border-radius: 10px;
            font-weight: 600;
        }
        .motor-box.running .motor-relay { background: rgba(76,175,80,0.2); color: #81C784; }
        .motor-box:not(.running) .motor-relay { background: rgba(244,67,54,0.2); color: #EF9A9A; }
        .timer-preview, .timer-countdown { font-size: 11px; color: #ffd54f; margin-top: 4px; }

        .btn-row { display: flex; gap: 10px; justify-content: center; }
        .btn { flex: 1; max-width: 150px; padding: 14px 16px; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; color: #fff; }
        .btn-start { background: var(--on-color); }
        .btn-start:disabled { background: #2a3a2a; opacity: 0.5; }
        .btn-stop { background: var(--off-color); }

        .ping-result { font-size: 10px; text-align: center; min-height: 14px; color: #ccc; }
        .ping-result.success { color: var(--on-color); }
        .ping-result.fail { color: var(--off-color); }

        .status-row { display: flex; gap: 6px; }
        .status-card { flex: 1; background: var(--bg-panel); padding: 8px; border-radius: 8px; text-align: center; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 3px; }
        .dot.green { background: var(--on-color); }
        .dot.red { background: var(--off-color); }
        .dot.gray { background: #666; }
        .status-card .label { font-size: 8px; color: var(--text-secondary); display: block; text-transform: uppercase; letter-spacing: 1px; }
        .status-card .value { font-size: 11px; font-weight: 700; }

        .timer-section { background: var(--bg-panel); border-radius: 8px; padding: 10px; text-align: center; }
        .timer-title { font-size: 9px; color: var(--text-secondary); margin-bottom: 4px; letter-spacing: 1px; }
        .timer-inputs { display: flex; gap: 8px; margin-bottom: 6px; }
        .timer-group { flex: 1; }
        .timer-group label { font-size: 7px; color: var(--text-secondary); display: block; margin-bottom: 2px; }
        .timer-group input { width: 100%; padding: 8px; background: rgba(0,0,0,0.3); border: 1px solid #444; border-radius: 5px; color: #fff; font-size: 15px; font-weight: 700; text-align: center; }
        .btn-timer { width: 100%; padding: 8px; background: linear-gradient(135deg, #667eea, #764ba2); border: none; border-radius: 5px; color: #fff; font-size: 11px; font-weight: 600; cursor: pointer; }
        .btn-timer-clear { width: 100%; padding: 5px; background: transparent; border: 1px solid #f44336; border-radius: 5px; color: #f44336; font-size: 10px; cursor: pointer; margin-top: 4px; }

        .stats-row { display: flex; gap: 6px; }
        .stat-card { flex: 1; background: var(--bg-panel); padding: 8px; border-radius: 8px; text-align: center; }
        .stat-value { font-size: 16px; font-weight: 700; color: var(--web-color); }
        .stat-label { font-size: 7px; color: var(--text-secondary); text-transform: uppercase; }

        .history-section { background: var(--bg-panel); border-radius: 8px; padding: 8px; flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .history-title { font-size: 9px; color: var(--text-secondary); text-align: center; margin-bottom: 4px; }
        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
        .history-item { display: flex; align-items: center; padding: 6px 8px; background: rgba(0,0,0,0.3); border-radius: 5px; border-left: 3px solid #555; font-size: 10px; }
        .history-item.push-button { border-left-color: var(--push-color); }
        .history-item.web-dashboard { border-left-color: var(--web-color); }
        .history-icon { font-weight: 700; margin-right: 6px; font-size: 12px; }
        .history-action { font-weight: 700; }
        .history-action.on { color: var(--on-color); }
        .history-action.off { color: var(--off-color); }
        .source-badge { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 7px; font-weight: 600; margin-left: 5px; }
        .source-badge.push { background: rgba(255,152,0,0.2); color: var(--push-color); }
        .source-badge.web { background: rgba(33,150,243,0.2); color: var(--web-color); }
        .source-badge.timer { background: rgba(156,39,176,0.2); color: var(--timer-color); }
        .history-time { margin-left: auto; font-size: 8px; color: var(--text-secondary); white-space: nowrap; }

        .shell-box { background: #0a0a0a; border: 1px solid #333; border-radius: 8px; flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .shell-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: #1a1a1a; border-bottom: 1px solid #333; font-size: 11px; color: #ccc; }
        .btn-clear { background: rgba(244,67,54,0.2); border: 1px solid #f44336; color: #f44336; padding: 3px 8px; border-radius: 4px; font-size: 9px; cursor: pointer; }
        .shell-content { flex: 1; overflow-y: auto; padding: 8px; font-family: 'Courier New', monospace; font-size: 9px; line-height: 1.5; color: #e0e0e0; }
        .log-line { display: flex; gap: 6px; border-bottom: 1px solid rgba(255,255,255,0.04); padding: 1px 0; }
        .log-time { color: #4FC3F7; white-space: nowrap; min-width: 65px; font-size: 8px; }
        .log-msg { word-break: break-all; }
        .log-empty { color: #555; text-align: center; padding: 20px; font-size: 10px; }

        .footer-text { font-size: 8px; color: #555; text-align: center; }
        .toast { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 12px; z-index: 9999; display: none; }
        .toast.show { display: block; }
        .error-msg { color: #f44336; font-size: 11px; display: none; margin-top: 5px; }
        .error-msg.show { display: block; }
    </style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- LOGIN PAGE -->
<div class="page active" id="loginPage">
    <div class="card" style="justify-content:center; align-items:center; text-align:center;">
        <h2 style="margin-bottom:15px;">BP Motor Panel</h2>
        <input type="email" id="emailInput" placeholder="Email" style="width:100%; margin:8px 0; padding:12px; background:#1a1a2e; border:1px solid #444; border-radius:6px; color:#fff;">
        <input type="password" id="passwordInput" placeholder="Password" style="width:100%; margin-bottom:8px; padding:12px; background:#1a1a2e; border:1px solid #444; border-radius:6px; color:#fff;">
        <button id="loginBtn" onclick="doLogin()" style="width:100%; background:#667eea; padding:12px; border:none; border-radius:6px; color:#fff; font-size:15px; font-weight:bold;">Sign In</button>
        <div class="error-msg" id="loginError"></div>
    </div>
</div>

<!-- DASHBOARD PAGE -->
<div class="page" id="dashboardPage">
    <div class="top-bar">
        <h2>BP Motor Panel</h2>
        <div>
            <button class="btn-sm btn-ping" onclick="checkConnection()">Check</button>
            <button class="btn-sm btn-restart" onclick="restartMaster()">Restart</button>
            <button class="btn-sm btn-logs" onclick="showPage('logsPage')">Logs</button>
            <button class="btn-sm btn-logout" onclick="doLogout()">Exit</button>
        </div>
    </div>
    <div class="card">
        <div class="user-info" id="userInfo">Welcome</div>
        
        <div class="motor-box" id="motorBox">
            <div class="motor-state" id="motorState">STOPPED</div>
            <div class="motor-info" id="motorSource"></div>
            <div class="motor-relay" id="motorRelay">Relay 2 (NC)</div>
            <div class="timer-preview" id="timerPreview"></div>
            <div class="timer-countdown" id="timerCountdown"></div>
        </div>
        
        <div class="btn-row">
            <button class="btn btn-start" id="startBtn" onclick="startMotor()">START</button>
            <button class="btn btn-stop" onclick="stopMotor()">STOP</button>
        </div>
        
        <div class="ping-result" id="pingResult"></div>
        
        <div class="status-row">
            <div class="status-card"><span class="dot gray" id="masterDot"></span><span class="label">Master</span><span class="value" id="masterStatus">--</span></div>
            <div class="status-card"><span class="dot gray" id="loraDot"></span><span class="label">LoRa</span><span class="value" id="loraStatus">--</span></div>
            <div class="status-card"><span class="dot gray" id="slaveDot"></span><span class="label">Slave</span><span class="value" id="slaveStatus">--</span></div>
        </div>
        
        <div class="timer-section">
            <div class="timer-title">TIMER</div>
            <div class="timer-inputs">
                <div class="timer-group"><label>Hours</label><input type="number" id="hrs" min="0" max="23" value="0"></div>
                <div class="timer-group"><label>Minutes</label><input type="number" id="mins" min="0" max="59" value="0"></div>
            </div>
            <button class="btn-timer" onclick="setTimerValue()">Set Timer</button>
            <button class="btn-timer-clear" onclick="clearTimerValue()">Clear Timer</button>
        </div>
        
        <div class="stats-row">
            <div class="stat-card"><div class="stat-value" id="statPings">0</div><div class="stat-label">Pings</div></div>
            <div class="stat-card"><div class="stat-value" id="statMissed">0</div><div class="stat-label">Missed</div></div>
            <div class="stat-card"><div class="stat-value" id="statRestarts">0</div><div class="stat-label">Restarts</div></div>
        </div>
        
        <div class="history-section">
            <div class="history-title">HISTORY (LAST 6)</div>
            <div class="history-list" id="historyList">
                <div class="log-empty">Waiting...</div>
            </div>
        </div>
    </div>
    <div class="footer-text">BP Motor Panel</div>
</div>

<!-- LOGS PAGE -->
<div class="page" id="logsPage">
    <div class="top-bar">
        <h2>Shell Logs</h2>
        <button class="btn-sm btn-logs" onclick="showPage('dashboardPage')">Home</button>
    </div>
    <div class="card">
        <div class="shell-box">
            <div class="shell-header"><span>MASTER</span><button class="btn-clear" onclick="clearLogs('master_logs')">Clear</button></div>
            <div class="shell-content" id="masterContent"><div class="log-empty">Waiting...</div></div>
        </div>
        <div class="shell-box">
            <div class="shell-header"><span>SLAVE</span><button class="btn-clear" onclick="clearLogs('slave_logs')">Clear</button></div>
            <div class="shell-content" id="slaveContent"><div class="log-empty">Waiting...</div></div>
        </div>
    </div>
    <div class="footer-text">BP Motor Panel</div>
</div>

<script>
    // Your Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyAdU0803CwzkKBIC9VTFBT6X29xhOeUi3g",
        authDomain: "bp-motor-panel.firebaseapp.com",
        databaseURL: "https://bp-motor-panel-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "bp-motor-panel",
        storageBucket: "bp-motor-panel.firebasestorage.app",
        messagingSenderId: "186220670912",
        appId: "1:186220670912:web:212992e82056da7a31e225"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let motorRunning = false;
    let motorHistory = [];
    let timerInterval = null;
    let pendingTimerMinutes = 0;
    let cmdId = 0;

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
    function clearLogs(path) { firebase.database().ref(path).remove(); }
    function showToast(m) {
        const t = document.getElementById('toast');
        t.textContent = m;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    // Unified timestamp formatter
    function formatTimestamp(ts) {
        if (!ts) return '--';
        if (ts < 1e12) ts *= 1000;
        const d = new Date(ts);
        if (isNaN(d.getTime())) return '--';
        const now = new Date();
        const diff = now - d;
        const timeStr = d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', hour12:true, timeZone:'Asia/Kolkata' });
        const dateStr = d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric', timeZone:'Asia/Kolkata' });
        if (diff < 60000) return 'Just now';
        if (diff < 3600000) return Math.floor(diff/60000)+'m ago';
        if (diff < 86400000) return timeStr;
        return dateStr+' '+timeStr;
    }

    // Auth state
    auth.onAuthStateChanged(user => {
        if (user) {
            showPage('dashboardPage');
            document.getElementById('userInfo').textContent = user.email;
            setupListeners();
            loadHistory();
            loadLogs();
        } else {
            showPage('loginPage');
        }
    });

    window.doLogin = function() {
        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value;
        const err = document.getElementById('loginError');
        err.classList.remove('show');
        if (!email || !password) { err.textContent = 'Enter email and password'; err.classList.add('show'); return; }
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        auth.signInWithEmailAndPassword(email, password)
            .catch(error => {
                err.textContent = error.message;
                err.classList.add('show');
                btn.disabled = false;
            });
    };
    window.doLogout = () => auth.signOut();

    window.restartMaster = function() {
        if (confirm('Restart master?')) {
            cmdId++;
            db.ref('motor_control').set({ command:'restart', command_id: cmdId, timestamp: Date.now(), source:'web' });
            showToast('Restart sent');
        }
    };
    window.checkConnection = function() {
        cmdId++;
        db.ref('motor_control').set({ command:'ping', command_id: cmdId, timestamp: Date.now(), source:'web' });
        showToast('Checking...');
        db.ref('ping_response').once('value').then(snap => {
            const d = snap.val();
            if (d) {
                const msg = `Master: ${d.master_online?'Online':'Offline'} | Slave: ${d.slave_online?'Online':'Offline'} | Motor: ${d.motor_running?'ON':'OFF'}`;
                document.getElementById('pingResult').textContent = msg;
                document.getElementById('pingResult').className = 'ping-result ' + (d.master_online ? 'success' : 'fail');
            }
        });
    };
    window.startMotor = function() {
        cmdId++;
        db.ref('motor_control').set({ command:'on', command_id: cmdId, timestamp: Date.now(), source:'web' });
        showToast('Starting...');
    };
    window.stopMotor = function() {
        cmdId++;
        db.ref('motor_control').set({ command:'off', command_id: cmdId, timestamp: Date.now(), source:'web' });
        showToast('Stopping...');
    };
    window.setTimerValue = function() {
        const h = parseInt(document.getElementById('hrs').value) || 0;
        const m = parseInt(document.getElementById('mins').value) || 0;
        const total = h*60+m;
        if (total <= 0) { showToast('Set time'); return; }
        pendingTimerMinutes = total;
        document.getElementById('timerPreview').textContent = `Timer: ${h}h ${m}m`;
        document.getElementById('timerPreview').style.display = 'block';
        showToast('Timer set - press START');
    };
    window.clearTimerValue = function() {
        pendingTimerMinutes = 0;
        document.getElementById('timerPreview').style.display = 'none';
        document.getElementById('timerCountdown').style.display = 'none';
        if (timerInterval) clearInterval(timerInterval);
        showToast('Timer cleared');
    };

    function setupListeners() {
        db.ref('motor_status').on('value', snap => {
            const d = snap.val();
            if (d) updateMotorBox(d.running, d.source);
        });
        db.ref('system_status').on('value', snap => {
            const d = snap.val();
            if (d) {
                document.getElementById('masterDot').className = 'dot ' + (d.wifi_connected?'green':'red');
                document.getElementById('masterStatus').textContent = d.wifi_connected?'Online':'Offline';
                document.getElementById('loraDot').className = 'dot ' + (d.slave_online?'green':'red');
                document.getElementById('loraStatus').textContent = d.slave_online?'Connected':'Off';
                document.getElementById('slaveDot').className = 'dot ' + ((d.slave_online && d.wifi_connected)?'green':'red');
                document.getElementById('slaveStatus').textContent = (d.slave_online && d.wifi_connected)?'Online':'Offline';
                document.getElementById('statPings').textContent = d.lora_ping_count || 0;
                document.getElementById('statMissed').textContent = d.lora_missed || 0;
            }
        });
        db.ref('slave_details').on('value', snap => {
            const d = snap.val();
            if (d) document.getElementById('statRestarts').textContent = d.restart_count || 0;
        });
        db.ref('timer').on('value', snap => {
            const d = snap.val();
            if (d && d.active && d.remaining_seconds > 0 && motorRunning) {
                updateTimerCountdown(true, d.remaining_seconds);
            } else {
                updateTimerCountdown(false, 0);
            }
        });
    }

    function updateMotorBox(running, source) {
        motorRunning = running;
        const box = document.getElementById('motorBox');
        const btn = document.getElementById('startBtn');
        if (running) {
            box.className = 'motor-box running';
            document.getElementById('motorState').textContent = 'ON';
            document.getElementById('motorSource').textContent = 'By: ' + getSrc(source);
            document.getElementById('motorRelay').textContent = 'Relay 1 (NO)';
            if (btn) btn.disabled = true;
        } else {
            box.className = 'motor-box';
            document.getElementById('motorState').textContent = 'STOPPED';
            document.getElementById('motorSource').textContent = source ? 'By: ' + getSrc(source) : '';
            document.getElementById('motorRelay').textContent = 'Relay 2 (NC)';
            if (btn) btn.disabled = false;
        }
    }

    function updateTimerCountdown(active, secs) {
        const el = document.getElementById('timerCountdown');
        if (active && secs > 0) {
            el.textContent = formatCountdown(secs);
            el.style.display = 'block';
            if (timerInterval) clearInterval(timerInterval);
            let remaining = secs;
            timerInterval = setInterval(() => {
                remaining--;
                if (remaining <= 0) { clearInterval(timerInterval); el.style.display = 'none'; }
                else { el.textContent = formatCountdown(remaining); }
            }, 1000);
        } else {
            el.style.display = 'none';
            if (timerInterval) clearInterval(timerInterval);
        }
    }
    function formatCountdown(s) {
        const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
        return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
    }

    function loadHistory() {
        db.ref('motor_history').orderByChild('timestamp').limitToLast(6).on('value', snap => {
            const d = snap.val();
            if (d) {
                motorHistory = Object.values(d).sort((a,b) => b.timestamp - a.timestamp).slice(0,6);
                renderHistory();
            }
        });
    }
    function renderHistory() {
        const list = document.getElementById('historyList');
        if (!motorHistory.length) {
            list.innerHTML = '<div class="log-empty">No events</div>';
            return;
        }
        let html = '';
        motorHistory.forEach(e => {
            const isOn = e.action === 'on';
            const cls = e.source === 'push_button' ? 'push-button' : 'web-dashboard';
            html += `<div class="history-item ${cls}">
                <span class="history-icon">${isOn?'ON':'OFF'}</span>
                <span class="history-action ${isOn?'on':'off'}">${isOn?'MOTOR ON':'MOTOR OFF'}</span>
                <span class="source-badge ${e.source==='push_button'?'push':'web'}">${getSrc(e.source)}</span>
                <span class="history-time">${formatTimestamp(e.timestamp)}</span>
            </div>`;
        });
        list.innerHTML = html;
    }

    function loadLogs() {
        db.ref('master_logs').orderByChild('time').limitToLast(20).on('value', snap => {
            const d = snap.val();
            document.getElementById('masterContent').innerHTML = d ? renderLogs(Object.values(d).sort((a,b) => b.time - a.time)) : '<div class="log-empty">No logs</div>';
        });
        db.ref('slave_logs').orderByChild('time').limitToLast(20).on('value', snap => {
            const d = snap.val();
            document.getElementById('slaveContent').innerHTML = d ? renderLogs(Object.values(d).sort((a,b) => b.time - a.time)) : '<div class="log-empty">No logs</div>';
        });
    }
    function renderLogs(logs) {
        let html = '';
        logs.forEach(l => {
            html += `<div class="log-line">
                <span class="log-time">${formatTimestamp(l.time)}</span>
                <span class="log-msg">${l.msg || ''}</span>
            </div>`;
        });
        return html || '<div class="log-empty">No logs</div>';
    }

    function getSrc(s) {
        const map = {push_button:'Button', web:'Web', web_dashboard:'Web', timer:'Timer'};
        return map[s] || s || 'System';
    }
</script>
</body>
</html>
