<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a1a">
    <title>BP Motor Panel</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue, query, limitToLast, get } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAdU0803CwzkKBIC9VTFBT6X29xhOeUi3g",
            authDomain: "bp-motor-panel.firebaseapp.com",
            databaseURL: "https://bp-motor-panel-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bp-motor-panel",
            storageBucket: "bp-motor-panel.firebasestorage.app",
            messagingSenderId: "186220670912",
            appId: "1:186220670912:web:212992e82056da7a31e225"
        };
        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app); window.db = getDatabase(app);
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.onAuthStateChanged = onAuthStateChanged; window.signOut = signOut;
        window.ref = ref; window.set = set; window.onValue = onValue;
        window.query = query; window.limitToLast = limitToLast; window.get = get;
        window.dispatchEvent(new Event('firebase-ready'));
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif; background: #0a0a1a;
            min-height: 100dvh; color: #ffffff; padding: 5px;
        }
        .page { display: none; max-width: 400px; margin: 0 auto; }
        .page.active { display: block; }
        .card { background: #16213e; padding: 10px; border-radius: 10px; margin-bottom: 5px; }
        
        input {
            width: 100%; padding: 10px; margin: 3px 0;
            background: #1a1a2e; border: 1px solid #444;
            border-radius: 5px; color: #ffffff; font-size: 13px;
        }
        button {
            padding: 10px 14px; border: none; border-radius: 5px;
            color: #ffffff; font-weight: bold; cursor: pointer; font-size: 10px;
        }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 3px; margin-bottom: 5px; }
        .top-bar h2 { font-size: 15px; }
        .btn-sm { padding: 8px 10px; font-size: 9px; min-width: 45px; }
        .btn-logs { background: #9C27B0; }
        .btn-ping { background: #FF9800; }
        .btn-restart { background: #f44336; }
        .btn-logout { background: #333; border: 1px solid #f44336; color: #f44336; }
        
        .motor-box {
            background: #0f3460; border-radius: 8px; padding: 14px;
            text-align: center; border: 2px solid #f44336; margin: 5px 0;
        }
        .motor-box.running { border-color: #4CAF50; }
        .motor-state { font-size: 20px; font-weight: 900; text-transform: uppercase; }
        .motor-box.running .motor-state { color: #4CAF50; }
        .motor-box:not(.running) .motor-state { color: #f44336; }
        .motor-info { font-size: 9px; color: #aaa; margin-top: 2px; }
        .motor-relay {
            font-size: 8px; margin-top: 4px; padding: 2px 10px;
            border-radius: 10px; display: inline-block; font-weight: bold;
        }
        .motor-box.running .motor-relay { background: rgba(76,175,80,0.2); color: #81C784; }
        .motor-box:not(.running) .motor-relay { background: rgba(244,67,54,0.2); color: #EF9A9A; }
        
        .btn-row { display: flex; gap: 8px; justify-content: center; margin: 6px 0; }
        .btn { padding: 14px 25px; border-radius: 8px; font-size: 14px; min-width: 90px; }
        .btn-start { background: #4CAF50; }
        .btn-start:disabled { background: #2a3a2a; opacity: 0.5; }
        .btn-stop { background: #f44336; }
        
        .ping-result { font-size: 9px; text-align: center; display: none; margin-top: 3px; }
        .ping-result.success { color: #4CAF50; display: block; }
        .ping-result.fail { color: #f44336; display: block; }
        
        .status-row { display: flex; gap: 4px; margin: 4px 0; }
        .status-card { flex: 1; background: #0f3460; padding: 8px; border-radius: 6px; text-align: center; }
        .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 3px; }
        .dot.green { background: #4CAF50; }
        .dot.red { background: #f44336; }
        .dot.gray { background: #666; }
        .status-card .label { font-size: 7px; color: #aaa; display: block; }
        .status-card .value { font-size: 10px; font-weight: bold; }
        
        .timer-section { background: #0f3460; border-radius: 8px; padding: 8px; margin: 4px 0; text-align: center; }
        .timer-title { font-size: 8px; color: #aaa; margin-bottom: 3px; }
        .timer-inputs { display: flex; gap: 5px; margin-bottom: 4px; }
        .timer-group { flex: 1; }
        .timer-group label { font-size: 7px; color: #aaa; display: block; }
        .timer-group input { font-size: 14px; text-align: center; font-weight: bold; }
        .btn-timer { width: 100%; padding: 8px; background: #667eea; font-size: 10px; }
        
        .stats-row { display: flex; gap: 4px; margin: 4px 0; }
        .stat-card { flex: 1; background: #0f3460; padding: 7px; border-radius: 6px; text-align: center; }
        .stat-value { font-size: 13px; font-weight: bold; color: #64B5F6; }
        .stat-label { font-size: 6px; color: #aaa; }
        
        .history-section { background: #0f3460; border-radius: 8px; padding: 8px; margin: 4px 0; }
        .history-title { font-size: 8px; color: #aaa; text-align: center; margin-bottom: 3px; }
        .history-list { max-height: 120px; overflow-y: auto; }
        .history-item {
            display: flex; padding: 5px 6px; margin: 1px 0;
            background: rgba(0,0,0,0.3); border-radius: 4px;
            font-size: 8px; border-left: 2px solid #555; align-items: center;
        }
        .history-item.push-button { border-left-color: #FF9800; }
        .history-item.web-dashboard { border-left-color: #2196F3; }
        .history-action { font-weight: bold; }
        .history-action.on { color: #4CAF50; }
        .history-action.off { color: #f44336; }
        .source-badge {
            display: inline-block; padding: 1px 4px; border-radius: 2px;
            font-size: 7px; font-weight: bold; margin-left: 5px;
        }
        .source-badge.push { background: rgba(255,152,0,0.2); color: #FF9800; }
        .source-badge.web { background: rgba(33,150,243,0.2); color: #64B5F6; }
        .source-badge.timer { background: rgba(156,39,176,0.2); color: #CE93D8; }
        .history-time { font-size: 7px; color: #aaa; margin-left: auto; white-space: nowrap; }
        
        .shell-box {
            background: #0a0a0a; border-radius: 6px; border: 1px solid #333;
            overflow: hidden; margin-bottom: 8px;
        }
        .shell-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 10px; background: #1a1a1a;
            font-size: 10px; color: #ccc; font-weight: bold;
        }
        .btn-clear {
            padding: 3px 8px; background: rgba(244,67,54,0.2);
            border: 1px solid #f44336; color: #f44336;
            border-radius: 3px; font-size: 8px; cursor: pointer;
        }
        .shell-content {
            padding: 8px; max-height: 200px; overflow-y: auto;
            font-family: 'Courier New', monospace; font-size: 9px;
            line-height: 1.5; color: #e0e0e0;
        }
        .log-line {
            padding: 1px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
            display: flex; gap: 6px;
        }
        .log-time { color: #4FC3F7; white-space: nowrap; font-size: 8px; min-width: 70px; }
        .log-msg { word-break: break-all; color: #e0e0e0; }
        
        .footer-text { color: #777; font-size: 7px; margin-top: 5px; text-align: center; }
        .toast {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 8px 16px;
            border-radius: 6px; font-size: 11px; z-index: 9999; display: none;
        }
        .toast.show { display: block; }
        .error-msg { color: #f44336; font-size: 11px; display: none; margin-top: 5px; }
        .error-msg.show { display: block; }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <!-- LOGIN -->
    <div class="page active" id="loginPage">
        <div class="card" style="text-align:center; margin-top: 30px;">
            <h2 style="margin-bottom: 10px;">BP Motor Panel</h2>
            <input type="email" id="emailInput" placeholder="Email">
            <input type="password" id="passwordInput" placeholder="Password">
            <button style="width:100%; background:#667eea; padding:12px; font-size:14px;" id="loginBtn" onclick="doLogin()">Sign In</button>
            <div class="error-msg" id="loginError"></div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div class="page" id="dashboardPage">
        <div class="top-bar">
            <h2>BP Motor Panel</h2>
            <div>
                <button class="btn-sm btn-ping" onclick="checkConnection()">Check</button>
                <button class="btn-sm btn-restart" onclick="restartMaster()">Restart</button>
                <button class="btn-sm btn-logs" onclick="showPage('logsPage')">Logs</button>
                <button class="btn-sm btn-logout" onclick="doLogout()">Exit</button>
            </div>
        </div>
        <div class="card">
            <div class="motor-box" id="motorBox">
                <div class="motor-state" id="motorState">STOPPED</div>
                <div class="motor-info" id="motorSource"></div>
                <div class="motor-relay" id="motorRelay">Relay 2 (NC)</div>
            </div>
            
            <div class="btn-row">
                <button class="btn btn-start" id="startBtn" onclick="startMotor()">START</button>
                <button class="btn btn-stop" onclick="stopMotor()">STOP</button>
            </div>
            
            <div class="ping-result" id="pingResult"></div>
            
            <div class="status-row">
                <div class="status-card"><span class="dot gray" id="masterDot"></span><span class="label">Master</span><span class="value" id="masterStatus">--</span></div>
                <div class="status-card"><span class="dot gray" id="loraDot"></span><span class="label">LoRa</span><span class="value" id="loraStatus">--</span></div>
                <div class="status-card"><span class="dot gray" id="slaveDot"></span><span class="label">Slave</span><span class="value" id="slaveStatus">--</span></div>
            </div>
            
            <div class="stats-row">
                <div class="stat-card"><div class="stat-value" id="statPings">0</div><div class="stat-label">Pings</div></div>
                <div class="stat-card"><div class="stat-value" id="statMissed">0</div><div class="stat-label">Missed</div></div>
                <div class="stat-card"><div class="stat-value" id="statRestarts">0</div><div class="stat-label">Restarts</div></div>
            </div>
            
            <div class="history-section">
                <div class="history-title">HISTORY (LAST 6)</div>
                <div class="history-list" id="historyList">
                    <div style="color:#aaa; font-size:9px; text-align:center;">Waiting...</div>
                </div>
            </div>
        </div>
        <div class="footer-text">BP Motor Panel</div>
    </div>

    <!-- LOGS -->
    <div class="page" id="logsPage">
        <div class="top-bar">
            <h2>Shell Logs</h2>
            <button class="btn-sm btn-logs" onclick="showPage('dashboardPage')">Home</button>
        </div>
        <div class="card">
            <div class="shell-box">
                <div class="shell-header"><span>MASTER (20)</span><button class="btn-clear" onclick="clearLogs('master_logs')">Clear</button></div>
                <div class="shell-content" id="masterContent"><div style="color:#555;">Waiting...</div></div>
            </div>
            <div class="shell-box">
                <div class="shell-header"><span>SLAVE (20)</span><button class="btn-clear" onclick="clearLogs('slave_logs')">Clear</button></div>
                <div class="shell-content" id="slaveContent"><div style="color:#555;">Waiting...</div></div>
            </div>
        </div>
        <div class="footer-text">BP Motor Panel</div>
    </div>

    <script>
        let motorRunning = false, motorHistory = [], cmdId = 0;

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        function clearLogs(path) { window.set(window.ref(window.db, path), null); }
        function showToast(m) {
            const t = document.getElementById('toast');
            t.textContent = m; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }
        
        window.addEventListener('firebase-ready', function() {
            const auth = window.auth, db = window.db;
            
            window.onAuthStateChanged(auth, function(user) {
                if (user) {
                    showPage('dashboardPage');
                    setupListeners();
                    loadHistory();
                    loadLogs();
                } else {
                    showPage('loginPage');
                }
            });
            
            window.doLogin = function() {
                const email = document.getElementById('emailInput').value.trim();
                const password = document.getElementById('passwordInput').value;
                const err = document.getElementById('loginError');
                err.classList.remove('show');
                if (!email || !password) { err.textContent = 'Enter credentials'; err.classList.add('show'); return; }
                const btn = document.getElementById('loginBtn');
                btn.disabled = true;
                window.signInWithEmailAndPassword(auth, email, password)
                    .catch(error => {
                        err.textContent = error.message;
                        err.classList.add('show');
                        btn.disabled = false;
                    });
            };
            
            window.doLogout = function() { window.signOut(auth); showPage('loginPage'); };
            
            window.restartMaster = function() {
                if (confirm('Restart master?')) {
                    cmdId++;
                    window.set(window.ref(db, 'motor_control'), {
                        command: 'restart', command_id: cmdId,
                        timestamp: Date.now(), source: 'web'
                    });
                    showToast('Restart sent');
                }
            };
            
            window.checkConnection = function() {
                cmdId++;
                window.set(window.ref(db, 'motor_control'), {
                    command: 'ping', command_id: cmdId,
                    timestamp: Date.now(), source: 'web'
                });
                showToast('Checking...');
                
                window.onValue(window.ref(db, 'ping_response'), function(snap) {
                    const d = snap.val();
                    if (d) {
                        const msg = 'Master: ' + (d.master_online ? 'Online' : 'Offline') +
                                   ' | Slave: ' + (d.slave_online ? 'Online' : 'Offline') +
                                   ' | Motor: ' + (d.motor_running ? 'ON' : 'OFF');
                        document.getElementById('pingResult').textContent = msg;
                        document.getElementById('pingResult').className = 'ping-result ' + (d.master_online ? 'success' : 'fail');
                    }
                }, { onlyOnce: true });
            };
            
            window.startMotor = function() {
                cmdId++;
                window.set(window.ref(db, 'motor_control'), {
                    command: 'on', command_id: cmdId,
                    timestamp: Date.now(), source: 'web'
                });
                showToast('Starting...');
            };
            
            window.stopMotor = function() {
                cmdId++;
                window.set(window.ref(db, 'motor_control'), {
                    command: 'off', command_id: cmdId,
                    timestamp: Date.now(), source: 'web'
                });
                showToast('Stopping...');
            };
            
            function setupListeners() {
                // PRIMARY: motor_status for instant update
                window.onValue(window.ref(db, 'motor_status'), function(snap) {
                    const d = snap.val();
                    if (d) updateMotorBox(d.running, d.source);
                });
                
                window.onValue(window.ref(db, 'system_status'), function(snap) {
                    const d = snap.val();
                    if (d) {
                        document.getElementById('masterDot').className = 'dot ' + (d.wifi_connected ? 'green' : 'red');
                        document.getElementById('masterStatus').textContent = d.wifi_connected ? 'Online' : 'Offline';
                        document.getElementById('loraDot').className = 'dot ' + (d.slave_online ? 'green' : 'red');
                        document.getElementById('loraStatus').textContent = d.slave_online ? 'Connected' : 'Off';
                        document.getElementById('slaveDot').className = 'dot ' + ((d.slave_online && d.wifi_connected) ? 'green' : 'red');
                        document.getElementById('slaveStatus').textContent = (d.slave_online && d.wifi_connected) ? 'Online' : 'Offline';
                        document.getElementById('statPings').textContent = d.lora_ping_count || 0;
                        document.getElementById('statMissed').textContent = d.lora_missed || 0;
                    }
                });
                
                window.onValue(window.ref(db, 'slave_details'), function(snap) {
                    const d = snap.val();
                    if (d) document.getElementById('statRestarts').textContent = d.restart_count || 0;
                });
            }
            
            function updateMotorBox(running, source) {
                motorRunning = running;
                const box = document.getElementById('motorBox');
                const btn = document.getElementById('startBtn');
                if (running) {
                    box.className = 'motor-box running';
                    document.getElementById('motorState').textContent = 'ON';
                    document.getElementById('motorSource').textContent = 'By: ' + getSrc(source);
                    document.getElementById('motorRelay').textContent = 'Relay 1 (NO)';
                    if (btn) btn.disabled = true;
                } else {
                    box.className = 'motor-box';
                    document.getElementById('motorState').textContent = 'STOPPED';
                    document.getElementById('motorSource').textContent = source ? 'By: ' + getSrc(source) : '';
                    document.getElementById('motorRelay').textContent = 'Relay 2 (NC)';
                    if (btn) btn.disabled = false;
                }
            }
            
            function loadHistory() {
                window.onValue(window.query(window.ref(db, 'motor_history'), window.limitToLast(6)), function(snap) {
                    const d = snap.val();
                    if (d) {
                        motorHistory = Object.values(d).sort((a, b) => b.timestamp - a.timestamp).slice(0, 6);
                        renderHistory();
                    }
                });
            }
            
            function renderHistory() {
                const list = document.getElementById('historyList');
                if (!motorHistory.length) {
                    list.innerHTML = '<div style="color:#aaa;font-size:9px;text-align:center;">No events</div>';
                    return;
                }
                let h = '';
                motorHistory.forEach(e => {
                    const isOn = e.action === 'on';
                    h += '<div class="history-item ' + (e.source === 'push_button' ? 'push-button' : e.source === 'web' ? 'web-dashboard' : '') + '">' +
                        '<span class="history-action ' + (isOn ? 'on' : 'off') + '">' + (isOn ? 'MOTOR ON' : 'MOTOR OFF') + '</span>' +
                        '<span class="source-badge ' + (e.source === 'push_button' ? 'push' : e.source === 'web' ? 'web' : 'timer') + '">' + getSrc(e.source) + '</span>' +
                        '<span class="history-time">' + formatTime(e.timestamp) + '</span>' +
                        '</div>';
                });
                list.innerHTML = h;
            }
            
            function loadLogs() {
                window.onValue(window.query(window.ref(db, 'master_logs'), window.limitToLast(20)), function(snap) {
                    const d = snap.val();
                    document.getElementById('masterContent').innerHTML = d ? renderLogs(Object.values(d).sort((a, b) => b.time - a.time)) : '<div style="color:#555;">No logs</div>';
                });
                window.onValue(window.query(window.ref(db, 'slave_logs'), window.limitToLast(20)), function(snap) {
                    const d = snap.val();
                    document.getElementById('slaveContent').innerHTML = d ? renderLogs(Object.values(d).sort((a, b) => b.time - a.time)) : '<div style="color:#555;">No logs</div>';
                });
            }
            
            function renderLogs(logs) {
                let h = '';
                logs.forEach(l => {
                    h += '<div class="log-line"><span class="log-time">' + formatLogTime(l.time) + '</span><span class="log-msg">' + (l.msg || '') + '</span></div>';
                });
                return h || '<div style="color:#555;">No logs</div>';
            }
            
            function formatLogTime(ts) {
                if (!ts) return '--:--:--';
                if (ts < 100000000000) ts = ts * 1000;
                const d = new Date(ts);
                if (isNaN(d.getTime())) return '--:--:--';
                return d.toLocaleTimeString('en-IN', {
                    hour: '2-digit', minute: '2-digit', second: '2-digit',
                    hour12: true, timeZone: 'Asia/Kolkata'
                });
            }
            
            function getSrc(s) {
                const m = {push_button: 'Button', web: 'Web', timer: 'Timer', timer_complete: 'Timer'};
                return m[s] || s || 'System';
            }
            
            function formatTime(ts) {
                if (!ts) return '--';
                if (ts < 100000000000) ts = ts * 1000;
                const d = new Date(ts);
                if (isNaN(d.getTime())) return '--';
                const n = new Date(), df = n - d;
                if (df < 60000) return 'Now';
                if (df < 3600000) return Math.floor(df / 60000) + 'm ago';
                const time = d.toLocaleTimeString('en-IN', {
                    hour: '2-digit', minute: '2-digit',
                    hour12: true, timeZone: 'Asia/Kolkata'
                });
                if (df < 86400000) return time;
                const date = d.toLocaleDateString('en-IN', {
                    day: '2-digit', month: 'short', timeZone: 'Asia/Kolkata'
                });
                return date + ' ' + time;
            }
        });
        
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && document.getElementById('loginPage').classList.contains('active')) doLogin();
        });
    </script>
</body>
</html>
